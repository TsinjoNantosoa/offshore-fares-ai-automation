<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offshore Fares · Ops Console</title>
  <meta name="description" content="AI travel operations orchestrator – live RFQ queue, fare desk, human approval and booking handoff.">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f6ef7'/%3E%3Cpath fill='white' d='M19 15v-1.6l-6-3.8V5.6a1.2 1.2 0 0 0-2.4 0v4L4.6 13.4V15l6-1.9v3.6L9 18v1.2l2.8-.8 2.8.8V18l-1.6-1.3v-3.6z'/%3E%3C/svg%3E">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard" aria-label="Offshore Fares – dashboard">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M19 15v-1.6l-6-3.8V5.6a1.2 1.2 0 0 0-2.4 0v4L4.6 13.4V15l6-1.9v3.6L9 18v1.2l2.8-.8 2.8.8V18l-1.6-1.3v-3.6z"/></svg>
        </span>
        <span class="brand-text"><strong>Offshore Fares</strong><span>Travel Ops Orchestrator</span></span>
      </a>
      <nav class="nav" id="tabs" aria-label="Main">
        <span class="nav-label">Operations</span>
        <a href="#/dashboard" data-tab="dashboard" data-icon="grid">Overview</a>
        <a href="#/queue" data-tab="queue" data-icon="list">Live RFQ queue <span class="nav-count" id="queueCount"></span></a>
        <a href="#/alerts" data-tab="alerts" data-icon="inbox">Desk inbox <span class="nav-count alert" id="alertCount"></span></a>
        <a href="#/outbox" data-tab="outbox" data-icon="send">Outbox</a>
        <span class="nav-label">System</span>
        <a href="#/activity" data-tab="activity" data-icon="activity">Activity &amp; audit</a>
        <a href="#/simulator" data-tab="simulator" data-icon="play">Demo simulator</a>
      </nav>
      <div class="sidebar-foot">
        <div class="env" id="modeBadges"></div>
        <div class="stack-note">n8n · PostgreSQL · OpenAI<br>Human-approved quotes</div>
      </div>
    </aside>
    <main class="main">
      <div id="view" class="view" aria-live="polite"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/ui-policy.js"></script>
  <script src="/app.js"></script>
</body>
</html>
